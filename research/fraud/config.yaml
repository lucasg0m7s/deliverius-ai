split:
  year: 2026
  # Expanding window inside training: fit up to month k, validate on k + 1 (three folds).
  train_months: [5, 6, 7, 8]
  validation_month: 9
  test_month: 10

# What one human review costs, in cents: a stated assumption, shipped in the model's decision.json.
review_cost_cents: 400
bootstrap_resamples: 2000
# The business rule the models must beat: review when the customer has this many claims in 30 days.
business_rule_claims_30d: 3

logistic:
  C: 1.0
  max_iter: 2000

lightgbm:
  fixed:
    objective: binary
    deterministic: true
    force_col_wise: true
    n_jobs: 1
    verbose: -1
    subsample: 1.0
    colsample_bytree: 1.0
  grid:
    num_leaves: [7, 15, 31]
    min_child_samples: [20, 50]
    learning_rate_and_estimators: [[0.05, 200]]
    reg_lambda: [0.0, 1.0]

# The CI gate on the published model, measured on the October test set. Filled from the single
# test run: measured PR-AUC minus `pr_auc_margin`, measured Brier plus `brier_margin`.
gate:
  pr_auc_margin: 0.01
  brier_margin: 0.005
  # Measured on 2026-11-09 (logistic regression, calibrated): PR-AUC 0.4524, Brier 0.0770.
  min_pr_auc: 0.4424
  max_brier: 0.0820

model:
  repository: G0m7s/deliverius-fraud
  version: 1.0.0
