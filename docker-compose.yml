services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deliverius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deliverius}
      POSTGRES_DB: ${POSTGRES_DB:-deliverius}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deliverius} -d ${POSTGRES_DB:-deliverius}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
