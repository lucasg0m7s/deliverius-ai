name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - name: Policy engine needs 100% branch coverage
        run: uv run pytest tests/unit/policy --cov-reset --cov=deliverius.policy --cov-fail-under=100
      - name: Masking needs 100% branch coverage
        run: uv run pytest tests/unit/privacy --cov-reset --cov=deliverius.privacy --cov-fail-under=100
      - run: uv run pytest -m integration --no-cov

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv export --locked --no-default-groups --no-emit-project --format requirements-txt -o requirements.txt
      - run: uv run pip-audit --requirement requirements.txt --no-deps --disable-pip

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
