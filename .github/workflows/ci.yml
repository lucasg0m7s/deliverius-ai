name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - name: Policy engine needs 100% branch coverage
        run: uv run pytest tests/unit/policy --cov-reset --cov=deliverius.policy --cov-fail-under=100
      - name: Masking needs 100% branch coverage
        run: uv run pytest tests/unit/privacy --cov-reset --cov=deliverius.privacy --cov-fail-under=100
      # The Postgres repository is only exercised by the integration tests, so they count here too.
      - name: Actions need 100% branch coverage (unit tests plus their Postgres tests)
        run: uv run pytest tests/unit/actions tests/integration/test_actions_*.py -m "not llm" --cov-reset --cov=deliverius.actions --cov-fail-under=100
      - uses: actions/cache@v4
        with:
          path: models/multilingual-e5-small
          # `MODEL_REVISION`, first eight characters; a unit test keeps the two equal.
          key: e5-small-614241f6
      - name: Embedding model (pinned revision, SHA-256 checked, skipped when cached)
        run: uv run python -m deliverius.cli retrieval fetch-model
      - run: uv run pytest -m integration --no-cov

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The action scans `before..after`, which breaks on the first push of a branch; the pinned
      # binary scans the whole history on every run.
      - name: Gitleaks (full history)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv export --locked --no-default-groups --no-emit-project --format requirements-txt -o requirements.txt
      - run: uv run pip-audit --requirement requirements.txt --no-deps --disable-pip

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
